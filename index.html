</head>

async function loadTryouts(){const {data}=await sb.from('tryouts').select('id,title,description,type,duration_minutes,is_premium,status').eq('status','published').neq('type','live').order('created_at',{ascending:false});tryoutsArea.innerHTML=(data||[]).map(x=>'<div class="data-card"><span class="tag">'+(x.is_premium?'👑 Premium':'🆓 Gratis')+'</span><h3>'+x.title+'</h3><p>'+ (x.description||'')+'</p><p>⏱️ '+x.duration_minutes+' menit</p><button class="btn btn-primary" onclick="startExam(\''+x.id+'\')">Mulai Tryout</button></div>').join('')||'<p class="lead">Belum ada Tryout.</p>'}
async function loadLive(){const now=new Date().toISOString();const {data}=await sb.from('tryouts').select('*').eq('type','live').eq('status','published').order('available_from');liveArea.innerHTML=(data||[]).map(x=>{const active=x.available_from&&x.available_until&&now>=x.available_from&&now<=x.available_until;return '<div class="data-card"><span class="tag">🔴 LIVE</span><h3>'+x.title+'</h3><p>Mulai: '+(x.available_from?new Date(x.available_from).toLocaleString('id-ID'):'Belum dijadwalkan')+'</p><button class="btn '+(active?'btn-primary':'btn-dark')+'" '+(active?'':'disabled')+' onclick="startExam(\''+x.id+'\')">'+(active?'Masuk Live':'Belum Dibuka')+'</button></div>'}).join('')||'<p class="lead">Belum ada Live Tryout.</p>'}
async function startExam(id){const {data}=await sb.from('tryout_questions').select('question_order,questions(*)').eq('tryout_id',id).order('question_order');examQuestions=(data||[]).map(x=>x.questions).filter(Boolean);if(!examQuestions.length)return alert('Soal belum tersedia.');currentExam=id;examIndex=0;answers={};showView('exam');renderQuestion();const {data:tr}=await sb.from('tryouts').select('duration_minutes').eq('id',id).single();let sec=(tr?.duration_minutes||60)*60;clearInterval(timerInt);timerInt=setInterval(()=>{examTimer.textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');if(--sec<0){clearInterval(timerInt);finishExam()}},1000)}
function renderQuestion(){const q=examQuestions[examIndex];examArea.innerHTML='<div class="lead">Soal '+(examIndex+1)+' / '+examQuestions.length+'</div><div class="question">'+q.question_text+'</div>'+['A','B','C','D','E'].filter(k=>q['option_'+k.toLowerCase()]).map(k=>'<button class="option '+(answers[q.id]===k?'selected':'')+'" onclick="answers[\''+q.id+'\']=\''+k+'\';renderQuestion()">'+k+'. '+q['option_'+k.toLowerCase()]+'</button>').join('')+'<div style="display:flex;justify-content:space-between;margin-top:20px"><button class="btn btn-dark" '+(examIndex===0?'disabled':'')+' onclick="examIndex--;renderQuestion()">← Sebelumnya</button>' +(examIndex===examQuestions.length-1?'<button class="btn btn-primary" onclick="finishExam()">Selesai</button>':'<button class="btn btn-primary" onclick="examIndex++;renderQuestion()">Berikutnya →</button>')+'</div>'}
async function finishExam(){clearInterval(timerInt);let correct=0;examQuestions.forEach(q=>{if(answers[q.id]===q.correct_answer)correct++});const {data:{user}}=await sb.auth.getUser();const score=Math.round(correct/examQuestions.length*100);await sb.from('tryout_attempts').insert({tryout_id:currentExam,user_id:user.id,submitted_at:new Date().toISOString(),score,correct_count:correct,wrong_count:examQuestions.length-correct,unanswered_count:examQuestions.length-Object.keys(answers).length,duration_seconds:0,status:'submitted'});alert('Tryout selesai! Nilai kamu: '+score);showView('tryouts')}
async function logout(){await sb.auth.signOut();location.reload()}sb.auth.getSession().then(({data:{session}})=>{if(session)startApp()});
</script></body>
</html>
